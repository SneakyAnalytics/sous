# Sous on the Beelink. Images are built by GitHub Actions and pulled from ghcr.io (deploy_to_beelink.sh).
#   Local build instead: docker compose build
# Sous on the Beelink. Ports are offset from the fitness tracker (3000/8000) so both run side by side.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    image: ghcr.io/sneakyanalytics/sous-api:${APP_VERSION:-main}
    build: ./backend
    container_name: sous-api
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - sous_data:/app/data
      # Read-only copy of the Google token (Task_Chore_Syncing's token_jake.pickle). Set GOOGLE_TOKEN_FILE and
      # GOOGLE_TOKEN_PATH=/run/google/token.pickle in .env to turn the calendar on; otherwise an empty placeholder is mounted.
      - ${GOOGLE_TOKEN_FILE:-./google_token.pickle}:/run/google/token.pickle:ro
    ports:
      - "127.0.0.1:8100:8000"   # the web container proxies /api, so the API needn't be reachable from the network
    mem_limit: 1536m   # headless Chromium for the Safeway lookups needs headroom
    logging: *logging

  # Copies database snapshots and recipe photos to the external drive (D:\SousBackups on the Beelink) and reports to the app.
  # It only adds files. The drive is optional: if it isn't connected this container can't start, but the app is unaffected
  # (deploy_to_beelink.sh starts it separately and warns). Set OFFSITE_HOST_DIR in .env to use a different folder.
  backup:
    image: ghcr.io/sneakyanalytics/sous-api:${APP_VERSION:-main}
    build: ./backend
    container_name: sous-backup
    restart: unless-stopped
    command: ["python", "-m", "app.offsite"]
    environment:
      - TZ=America/Los_Angeles
      - DATA_DIR=/app/data
      - OFFSITE_DIR=/offsite
    volumes:
      - sous_data:/app/data
      - ${OFFSITE_HOST_DIR:-D:/SousBackups}:/offsite
    healthcheck:
      test: ["CMD", "python", "-m", "app.offsite", "--healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    mem_limit: 128m
    logging: *logging

  web:
    image: ghcr.io/sneakyanalytics/sous-web:${APP_VERSION:-main}
    build: ./frontend
    container_name: sous-web
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - api
    mem_limit: 128m
    logging: *logging

volumes:
  sous_data:
    # External so `docker compose down -v` can never delete the recipes. deploy_to_beelink.sh creates it if missing.
    external: true
    name: sous_sous_data
